name: Release CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            asset: loutre-view-darwin-arm64
          - runner: macos-13
            arch: amd64
            asset: loutre-view-darwin-amd64

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Package
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir "$ASSET"
          cp loutre-view "$ASSET/"
          tar -czf "$ASSET.tar.gz" "$ASSET"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: loutre-view-darwin-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum loutre-view-*.tar.gz > checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/loutre-view-*.tar.gz
            dist/checksums.txt
